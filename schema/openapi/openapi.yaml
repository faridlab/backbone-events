components:
  schemas:
    Event:
      type: object
      required:
        - id
        - name
        - stage_id
        - kanban_state
        - date_begin
        - date_end
        - date_tz
        - is_multi_slots
        - event_slot_count
        - seats_limited
        - seats_max
        - badge_format
        - is_published
        - metadata
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        event_type_id:
          nullable: true
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        kanban_state:
          type: string
        date_begin:
          type: string
          format: date-time
        date_end:
          type: string
          format: date-time
        date_tz:
          type: string
          maxLength: 60
        is_multi_slots:
          type: boolean
        event_slot_count:
          type: integer
          format: int32
        seats_limited:
          type: boolean
        seats_max:
          type: integer
          format: int32
        address_id:
          nullable: true
          type: string
          format: uuid
        organizer_id:
          nullable: true
          type: string
          format: uuid
        user_id:
          nullable: true
          type: string
