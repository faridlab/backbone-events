# event Module - Hooks Index
# Version: 1
#
# Module-level configuration for hooks (lifecycle behaviors): the
# registration bare-branch + booth state machines, the ZERO-outbox-event
# declaration (with the v0.2.0 inbound seam-verb declarations), and the
# THREE declared scheduled jobs (ADR-0020 postures).

module: event
version: 1

imports:
  - registration_state.hook.yaml
  - booth_state.hook.yaml

# =============================================================================
# Module-level configuration
# =============================================================================

config:
  audit:
    retention_days: 365
    critical_events:
      - event_published          # the fence verb — publish state changed
      - event_unpublished        # the fence verb — publish state changed
      - publish_refused          # a generic patch tried to write the fence pair
      - registration_refused     # a seat/sale-window refusal (durable fact)
      - scheduler_failed         # a typed scheduler failure
      - capability_refused       # a capability gate refusal (enumeration gate held)

  notifications:
    email_enabled: false
    sms_enabled: false
    push_enabled: false

# =============================================================================
# Shared domain events
# =============================================================================
# ZERO event-owned outbox events by design. The module owns NO outbox table
# and the host's outbox_schemas producer set carries NO event entry
# (absence is the truthful posture — adding a producer requires a real
# consumer + an outbox_schemas decision in the same change):
#  - OUTBOUND communication rides backbone-mail's queue directly (the ONE
#    sibling crate edge) through the host-installed EventTemplateRenderer /
#    EventMailQueue / EventSmsQueue ports;
#  - INBOUND, the v0.2.0 overlay declares TWO consumed carriers + the
#    paid-hook family — all consumed through TYPED SEAM VERBS the host
#    bridges (the buying-consumers precedent: the host owns the envelope
#    parse + the outbox inbox; the module owns the semantics). The verbs
#    are idempotent per delivery through the event.seam_inbox table
#    (INSERT .. ON CONFLICT DO NOTHING inside the verb transaction):
#
#    SalesOrderConfirmed  (selling.hook.yaml:135-140; payload order_id,
#                         company_id, customer_id, grand_total, currency)
#                         -> SaleSeamService::on_order_confirmed — mints
#                         (single paid SO -> born draft held; free -> born
#                         open + armed) or heals an already-linked group
#                         (forward-only); the registration specs ride the
#                         typed command (the host enriches from the order's
#                         lines).
#    SalesOrderCancelled  (same family; payload order_id, company_id,
#                         customer_id) -> SaleSeamService::on_order_cancelled
#                         — mirrors sale_order_state='cancel' (sale_status
#                         KEPT) and cascades the whole linked registration
#                         group to 'cancel'. Booths are NOT freed (register
#                         row).
#    PAID-HOOK FAMILY     (the billing seam: no carrier exists at this pin
#                         — backbone-billing declares events: {}; the verb
#                         lands NOW, the producer at compose)
#                         -> SaleSeamService::on_order_paid — to_pay -> sold
#                         + the ES-4 heal (draft/cancel -> open, armed) +
#                         the booths is_paid one-way latch.
events: {}

# =============================================================================
# Scheduled jobs (ADR-0020 postures) — exactly THREE
# =============================================================================
# Nothing else owns a clock: the ticket sale window is READ-TIME LAZY (a
# pure read predicate over stored instants — no cron flips anything,
# docs/spec.md §2.3); mail_state is a derived read; publication visibility
# is read-derived.
#
# ASYNC MODE IS THE ONLY MODE: registration verbs ARM in-transaction (cheap
# row updates) and NEVER execute the scheduler inline — the upstream inline
# SUPERUSER execution path (EVM2-12) is banned; the verb never blocks on
# mail or lead generation.

scheduled_jobs:

  event-mail-scheduler:
    schedule: "*/20 * * * *"            # the FLOOR tick; exact dispatch is event-driven
    handler: "event::run_due_schedulers"
    posture: self_arming
    # Named trigger sources (the interval is a floor, the triggers are the
    # contract — ADR-0020):
    triggers:
      - scheduler_row_scheduled_date_recompute   # T1: arm at write/recompute of the row's due date
      - registration_entering_open               # T2: create-default-open + draft/cancel -> open heal (DRAFT-HEAL)
      - batch_overflow_rearm                     # T3: a pass hit its per-pass cap with work left
      - slot_child_materialization               # T4: slot-grain children arm like the parent
    commit_policy: commit_per_batch             # batches of EVENT_MAIL_BATCH (default 50) inside EVENT_MAIL_CRON_LIMIT (default 1000); sends staged + cursor advanced + receipts written per COMMIT; overflow re-arms (T3). The at-least-once window per batch is the declared trade-off; consumers are idempotent (receipt UNIQUE + mail_sent).
    pickup_lock: true                           # FOR UPDATE SKIP LOCKED claim — lint-enforced (MMB-4 class)

  event-mark-done-sweep:
    schedule: "41 3 * * *"              # daily 03:41 UTC (off the :00/:30 marks)
    handler: "event::sweep_mark_done"
    posture: pull                       # deviation, named: upstream _gc_mark_events_done rode @api.autovacuum (ADR-0020 autovacuum_ride); no shared backbone autovacuum host exists, so a daily pull on the host wall-clock scheduler is the truthful nearest posture (the website visitor-gc precedent)
    commit_policy: commit_per_batch     # bounded batches with commit-progress (upstream's unbounded search is not ported)
    pickup_lock: true                   # FOR UPDATE SKIP LOCKED event claims

  event-lead-generation:
    schedule: "*/15 * * * *"            # the FLOOR tick; exact dispatch is trigger-driven
    handler: "event::run_due_lead_requests"
    posture: self_arming
    triggers:
      - registration_created_or_confirmed_or_done   # the registration verbs arm the per-event queue row (on_create/on_confirm/on_done axes of an ACTIVE rule)
      - lead_rule_created_or_activated              # a new/activated rule arms the events in its scope
    commit_policy: commit_per_batch     # each claimed request commits its generated groups before the next claim (EVENT_LEAD_BATCH default 200, EVENT_LEAD_CRON_LIMIT default 1000 — upstream's 200 threshold as the batch posture); provenance UNIQUE(rule_id, group_key) makes the at-least-once re-run idempotent
    pickup_lock: true                   # the request LEASE: one UPDATE stamps claimed_at (SKIP LOCKED inside the statement), and the lease column holds the exclusion for the walker's WHOLE per-event pass — a second pass or the officer run verb cannot claim a freshly-leased event; finish clears the lease, a dead walker's lease expires (900s) and the next tick re-runs at-least-once

    # Upstream's SYNC arm on registration create (and every superuser
    # execution site) is NOT ported — async-only, the §8.2 family posture.
    # The lead sink is the host-installed EventLeadSink port; the refusing
    # default parks the request loudly (error_detail) instead of skipping.
