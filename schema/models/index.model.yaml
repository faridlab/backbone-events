# =============================================================================
# event Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:`/`schema:` give this module its
# OWN Postgres schema `event` (migrations emit `CREATE SCHEMA event` and
# qualify tables as `event.<table>`) — the convention every backbone module
# follows. The CRATE is `backbone-events` (plural, the whole upstream
# eight-addon chain absorbs into it) while the SCHEMA is `event` (singular,
# the upstream Odoo addon name), per the module council ruling "ONE crate
# backbone-events (schema: event) … Route base /api/v1/event per the
# schema-name ruling" — the same crate-name/schema-name relationship as
# backbone-website/`website` and backbone-portal/`portal`.
#
# Enum types are created UNQUALIFIED in the `public` schema (the module
# convention, ratified). The names below were census-checked against every
# module migration in the tree before landing: backbone-calendar owns the
# four `event_*` enums of ITS event family (event_attendee_state,
# event_exception_kind, event_privacy, event_recurrence_freq) — every name
# this module creates is distinct from those four and from every other
# `event_*`/`*_event_*` stem in the tree. The census re-runs before the enum
# migration lands.
# =============================================================================

module: event
version: 2
schema: event
description: "event — the events core: registrations under one authoritative seat counter (lock-first, count-then-insert), the two-axis event lifecycle (stage + sticky-cancel kanban health), the publication-fenced capability surface (/ics, my-tickets), and the self-arming communication scheduler whose completion reads per-recipient receipts (Odoo `event` addon port, core arm of the eight-addon chain)"

# =============================================================================
# Tenancy: none, by design (ADR-0029)
# -----------------------------------------------------------------------------
# This module is tenant-agnostic. It declares NO company axis and NO fence:
# RLS stays ENABLE+FORCE with zero policies after the strip, and the composing
# service installs the org-unit fence (tenancy.yaml + decorator) at composition
# time. The historical shared_blank posture (nullable company_id with a NULL
# "visible to all" arm on events + registrations) ports to the composed world
# as ROOT-ANCHORED rows: the decorator's allow_root admits tenant-root-anchored
# events/registrations, and the scope union (subtree ∪ tenant root) carries
# the visible-to-all semantics. Registration org_unit_id still derives from
# its event at write — the desk-scanner cross-company reads keep working.
# Everything else in the module (stages, types, tags, tickets, slots,
# questions, the scheduler and booth/lead families) stays company-less global
# master data, unfenced — the composer scopes only events + registrations.
# -----------------------------------------------------------------------------

config:
  database: postgresql
  soft_delete: true          # `registrations.active` is the Odoo archive axis
                             # (a SEPARATE declared column the seat + mail
                             # domains read); metadata.deleted_at rides via
                             # @audit_metadata as everywhere in the family
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# No sapiens edge exists in this module: officers authenticate through the
# host's company_auth; attendee identity is plain stored fields plus a
# logical party ref. Actor columns are logical refs by construction (the
# backbone-website shape).

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    # Plain nullable uuids — NO sapiens edge in this module (officers arrive
    # through the host's company_auth; the scheduler's system edges are NULL).
    created_by:
      type: uuid?
      attributes: ["@exclude_from_foreign_key_check"]
      description: "Officer who created this record (logical ref — no cross-schema constraint)"
    updated_by:
      type: uuid?
      attributes: ["@exclude_from_foreign_key_check"]
      description: "Officer who last updated this record (logical ref)"
    deleted_by:
      type: uuid?
      attributes: ["@exclude_from_foreign_key_check"]
      description: "Officer who deleted this record (logical ref)"

  Metadata: [Timestamps, Actors]

# Import each entity model. Discovery is a recursive glob, but the list is
# kept accurate for readers.
imports:
  - stage.model.yaml                # Stage
  - event_type.model.yaml           # EventType
  - tag.model.yaml                  # Tag, TagCategory
  - event.model.yaml                # Event
  - ticket.model.yaml               # Ticket
  - slot.model.yaml                 # Slot
  - question.model.yaml             # Question, QuestionAnswer, RegistrationQuestion
  - registration.model.yaml         # Registration
  - registration_answer.model.yaml  # RegistrationAnswer
  - mail.model.yaml                 # Mail (the scheduler row)
  - mail_registration.model.yaml    # MailRegistration (the receipt grain)
  - mail_slot.model.yaml            # MailSlot (slot-grain scheduler child)
  - type_mail.model.yaml            # TypeMail (template mail line)
  - event_audit_log.model.yaml      # EventAuditLog
  - booth.model.yaml                # BoothCategory, Booth, TypeBooth (v0.2.0)
  - booth_booking.model.yaml        # BoothBooking (the reified booking, v0.2.0)
  - lead_rule.model.yaml            # LeadRule, LeadRulePredicate (v0.2.0)
  - lead_request.model.yaml         # LeadRequest (the generation queue, v0.2.0)
  - lead_provenance.model.yaml      # LeadProvenance, LeadProvenanceRegistration (v0.2.0)

# =============================================================================
# FLAG-ID COVERAGE — the register floor rows this increment owns
# (docs/spec.md §13 is the normative table; this index carries the pointer;
# the v0.2.0 overlay rows are normative in docs/spec-overlay.md §R):
#   EBB-1  → ONE seat aggregation service + SELECT ... FOR UPDATE inside the
#            registration verb (count-then-insert, one transaction).
#   EBB-2  → completion from per-recipient receipts; late registrants
#            re-open the scheduler.
#   EBB-3  → 'sent'=queued documented (receipts mark at enqueue).
#   EBB-4  → typed, visible per-scheduler failures (error_datetime/error_kind).
#   EBB-6  → /ics + my-tickets publication-checked, Tier A capability
#            tokens, not id-enumerable.
#   EVM2-3 → UNIQUE(scheduler_id, registration_id) on the receipt grain (db).
#   EVM2-4 → every seat count AND mail eligibility filter reads
#            state IN ('open','done') AND active.
#   EVM-15 → shared_blank declared with the per-model posture map (above).
#   DRAFT-HEAL → any transition INTO 'open' arms the after_sub engines.
#   --- v0.2.0 overlay (docs/spec-overlay.md §R is normative) ---
#   ES-3   → sale-seam mint: single paid SO -> born draft; free -> born open
#            (idempotent via the seam inbox; THE seat head guards the mint).
#   ES-4   → draft -> open heals ONLY on the paid fact (paid-hook family);
#            forward-only (open/done never demoted); manual verbs preserved.
#   EVM-2  → template-apply stays create-once-only with PER-OVERLAY
#            whitelists (type_mails -> mails; type_booths -> booths
#            [name, booth_category_id]); no destructive re-unlink path.
#   EP-2   → tickets.product_id + booth_categories.product_id logical refs;
#            event.event_linked_products view + billing-policy default const;
#            NO catalog enum mutation (the catalog seat ratifies at compose).
#   EBT-3  → booth confirm is an EXPLICIT verb (no auto-confirm hook).
#   EBS-1  → real exclusivity = partial unique on the confirmed booking;
#            the availability pre-check is demoted to a nice-error pre-check.
#   EBS-2  → UNIQUE(sale_order_line_id, event_booth_id) at the booking grain.
#   EBS-3  → collateral competitor-order-cancel NOT ported (deliberate,
#            registered): first-confirm-wins + LOUD typed loser.
#   ECR-2  → UNIQUE(event_id) on the generation queue (one request per event
#            at a time; a trigger re-opens a done row).
#   ECR-4  → stored domains BANNED — typed predicate rows over the closed
#            event/types/company/question-answer vocabulary; the
#            answer-to-rule bridge is a typed verb.
#   ESM-1  → ONE template cascade for mail+sms (the collapsed
#            on_template_deleted verb — deviation from literal DB-level
#            cascade registered: cross-module FK impossible).
#   ESM-2  → unconfigured sms gateway parks scheduler rows LOUDLY
#            (sms_enqueue_refused; parked is not silently queued).
#   EBG-1  → barcode stays globally unique; the desk verb is EXACT-match +
#            authenticated (EVM2-6).
#   NOMENCLATURE → the badge/nomenclature codec machinery is FENCED
#            (register row; no codec until a rendering consumer exists).
# =============================================================================
